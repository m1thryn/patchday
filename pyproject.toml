[project]
name = "patchday"
version = "0.1.0"
description = "Browse Microsoft Patch Tuesday CVEs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.0",
    "rich>=15.0.0",
    "textual>=6.0.0",
]

[project.scripts]
patchday = "patchday.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
